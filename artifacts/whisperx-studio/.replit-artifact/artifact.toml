kind = "web"
previewPath = "/"
title = "WhisperX Studio"
version = "1.0.0"
id = "artifacts/whisperx-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19486

[services.development]
run = "pnpm --filter @workspace/whisperx-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/whisperx-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/whisperx-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19486"
BASE_PATH = "/"
